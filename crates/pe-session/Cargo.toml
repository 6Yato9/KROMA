[package]
name = "pe-session"
description = "The workflow layer: the open photograph, its edit, and the rules about writing files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pe-color = { version = "0.0.1", path = "../pe-color" }
pe-core = { version = "0.0.1", path = "../pe-core" }
pe-effects = { version = "0.0.1", path = "../pe-effects" }
pe-io = { version = "0.0.1", path = "../pe-io" }
pe-render = { version = "0.0.1", path = "../pe-render" }
pe-scopes = { version = "0.0.1", path = "../pe-scopes" }
# The palette. The engine composites a side by side, so it has to know what
# colour the surround behind the two pictures is, and there is one answer to
# that for both shells.
pe-theme = { version = "0.0.1", path = "../pe-theme" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
wgpu = "27"
pollster = "0.4"

[dev-dependencies]
tempfile = "3"
