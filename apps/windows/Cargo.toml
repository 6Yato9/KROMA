[package]
name = "pe-windows"
description = "Windows shell. Contains no image processing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
pe-color = { version = "0.0.1", path = "../../crates/pe-color" }
pe-core = { version = "0.0.1", path = "../../crates/pe-core" }
pe-render = { version = "0.0.1", path = "../../crates/pe-render" }
pe-io = { version = "0.0.1", path = "../../crates/pe-io" }
wgpu = "27"
egui = "0.33"
egui-wgpu = "0.33"
eframe = { version = "0.33", default-features = false, features = ["wgpu", "default_fonts"] }
pe-effects = { version = "0.0.1", path = "../../crates/pe-effects" }
rfd = "0.17.2"
pe-scopes = { version = "0.0.1", path = "../../crates/pe-scopes" }
