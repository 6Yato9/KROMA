# XcodeGen spec.
#
# The .xcodeproj is generated, not committed, because a pbxproj is unmergeable
# and every branch that touches it conflicts. On the Mac:
#
#   brew install xcodegen cbindgen
#   cd apps/apple && xcodegen generate && open PhotoEditor.xcodeproj
name: PhotoEditor
options:
  bundleIdPrefix: local.photoeditor
  deploymentTarget:
    macOS: "14.0"

targets:
  PhotoEditor:
    type: application
    platform: macOS
    sources:
      - path: PhotoEditor
      - path: KromaKit
    # Hand-written now rather than generated, because an exported uniform type
    # is an array of dictionaries and there is no `INFOPLIST_KEY_` for that.
    #
    # `com.kroma.effect-key` is what an effect dragged out of the shelf is
    # carried as. Declared so the system knows the identifier: an undeclared
    # one works inside a single process and fails between two, which is what a
    # drag between windows is.
    info:
      path: PhotoEditor/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.kroma.effect-key
            UTTypeDescription: Kroma effect
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification: {}
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: PhotoEditor/PhotoEditor-Bridging-Header.h
        # Points at the universal library build-engine.sh produces.
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/universal/$(CONFIGURATION:lower)
        OTHER_LDFLAGS: -lpe_ffi
        HEADER_SEARCH_PATHS: $(SRCROOT)/PhotoEditor
    preBuildScripts:
      - name: Build Rust engine
        script: "\"$SRCROOT/build-engine.sh\""
        basedOnDependencyAnalysis: false

  # The Swift tests. KromaKit is a source directory rather than a Swift package
  # precisely so it can compile into this bundle with a bridging header, which
  # a package cannot have.
  KromaKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KromaKit
      - path: KromaKitTests
      - path: Fixtures
        buildPhase: resources
    settings:
      base:
        # The same bridging header the application uses.
        SWIFT_OBJC_BRIDGING_HEADER: PhotoEditor/PhotoEditor-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: "YES"
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/universal/$(CONFIGURATION:lower)
        OTHER_LDFLAGS: -lpe_ffi
        # Reuses the header build-engine.sh generates for the application, so
        # there is never a third copy to drift.
        HEADER_SEARCH_PATHS: $(SRCROOT)/PhotoEditor
        # The sources compile into the bundle rather than into a framework, so
        # naming the bundle's module KromaKit is what makes
        # `@testable import KromaKit` resolve.
        PRODUCT_MODULE_NAME: KromaKit
    preBuildScripts:
      - name: Build Rust engine
        script: "\"$SRCROOT/build-engine.sh\""
        basedOnDependencyAnalysis: false
    # An explicit scheme, so `xcodebuild test -scheme KromaKitTests` works from
    # a clean checkout. Naming the bundle under `testTargets` is what fills the
    # scheme's <Testables>; without it the tests build and none of them run.
    scheme:
      testTargets:
        - KromaKitTests

  Spike:
    type: application
    platform: macOS
    sources:
      - path: Spike
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Spike/Spike-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: "YES"
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../target/universal/$(CONFIGURATION:lower)
        OTHER_LDFLAGS: -lpe_ffi
        HEADER_SEARCH_PATHS: $(SRCROOT)/Spike
    preBuildScripts:
      - name: Build Rust engine
        script: "\"$SRCROOT/build-engine.sh\""
        basedOnDependencyAnalysis: false
