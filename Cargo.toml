[workspace]
resolver = "3"
members = [
    "crates/pe-color",
    "crates/pe-core",
    "crates/pe-effects",
    "crates/pe-render",
    "crates/pe-scopes",
    "crates/pe-io",
    "crates/pe-session",
    "crates/pe-theme",
    "crates/pe-ffi",
    "apps/windows",
    "tests/golden",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Kroma — DaVinci Resolve's colour page, rebuilt for photographs"
repository = "https://github.com/6Yato9/KROMA"

# Release profile matters more than usual here: the CPU reference path in
# pe-color is used by the golden tests, and a debug build of it is ~40x slower.
[profile.dev.package."pe-color"]
opt-level = 2

[profile.dev.package."pe-io"]
opt-level = 2
