name: CI

on:
  push:
    # This repository's branch is `master`. It said `main` from the first
    # commit, so no push has ever triggered a run — the workflow has been
    # green by never having executed, which is the one failure mode a CI
    # badge cannot show you.
    branches: [master]
  pull_request:
  # So a run can be asked for without inventing a commit — useful when a push
  # has gone in but no run appeared, which is a thing that happens.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is in the matrix from M0, long before the Mac app exists. The
        # engine crates are meant to be platform-independent, and the cheapest
        # way to keep that true is to notice the day it stops being true.
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # --no-fail-fast, because cargo test otherwise stops at the first
      # failing test *binary* and every crate after it in the run order never
      # runs at all. The count that comes back is then not the number of
      # failures, it is the number of failures before the first one — which is
      # the same shape of answer as no answer, and reads like a smaller
      # problem than it is.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      # Golden references are committed. If a shader or colour change alters
      # output, the diff images explain what moved.
      - name: Upload golden-test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: tests/golden/out/
          if-no-files-found: ignore

  # A script committed without its executable bit is a script nobody can run
  # from a fresh clone — and it is invisible on a filesystem that reports 777
  # for everything, which is what this repository is developed on. That is
  # exactly what happened to `build-engine.sh`: mode 644 in the index, 755 on
  # the author's disc, and the Mac app unbuildable by anyone else until CI ran
  # for the first time and said "Permission denied".
  script-modes:
    name: scripts are executable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every tracked script is executable
        run: |
          bad=$(git ls-files -s '*.sh' | awk '$1 != "100755" { print $4 }')
          if [ -n "$bad" ]; then
            echo "committed without the executable bit:"
            echo "$bad"
            echo
            echo "fix with: git update-index --chmod=+x <path>"
            exit 1
          fi
          echo "all $(git ls-files '*.sh' | wc -l | tr -d ' ') tracked scripts are executable"

  ffi-header:
    name: FFI header is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      # Generating it here proves the C ABI surface still parses, which is the
      # cheap half of keeping the Swift bridge honest.
      - name: Generate header
        run: cbindgen --config cbindgen.toml --crate pe-ffi --output /tmp/pe_ffi.h
      - name: Show header
        run: cat /tmp/pe_ffi.h

  apple:
    name: the Apple shells build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        run: brew install xcodegen && cargo install cbindgen --locked
      # The fixtures the Swift tests decode are committed. If a field is added
      # in Rust and not regenerated, this is where it is noticed — before the
      # Swift side fails to decode something it has never seen.
      - name: Fixtures are current
        run: cargo test -p pe-session --test fixtures
      # Both targets. The spike is the smallest thing that proves the layer
      # path; the application is the thing anybody actually runs, and it was
      # left out of CI back when it was a scaffold and not added when it
      # stopped being one.
      - name: Build the spike
        run: |
          cd apps/apple
          xcodegen generate
          xcodebuild -project PhotoEditor.xcodeproj -scheme Spike \
                     -configuration Debug build CODE_SIGNING_ALLOWED=NO
      - name: Build the application
        run: |
          cd apps/apple
          xcodebuild -project PhotoEditor.xcodeproj -scheme PhotoEditor \
                     -configuration Debug build CODE_SIGNING_ALLOWED=NO
      # The Swift half of the fixture check. A field added in Rust and not
      # here fails on this side, which is the whole reason the fixtures are
      # committed rather than generated at test time.
      - name: Test KromaKit
        run: |
          cd apps/apple
          xcodebuild test -project PhotoEditor.xcodeproj -scheme KromaKitTests \
                     -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
