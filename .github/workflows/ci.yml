name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is in the matrix from M0, long before the Mac app exists. The
        # engine crates are meant to be platform-independent, and the cheapest
        # way to keep that true is to notice the day it stops being true.
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test
        run: cargo test --workspace

      # Golden references are committed. If a shader or colour change alters
      # output, the diff images explain what moved.
      - name: Upload golden-test failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-${{ matrix.os }}
          path: tests/golden/out/
          if-no-files-found: ignore

  ffi-header:
    name: FFI header is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cbindgen
        run: cargo install cbindgen --locked
      # Generating it here proves the C ABI surface still parses, which is the
      # cheap half of keeping the Swift bridge honest while the Mac app is
      # still a scaffold.
      - name: Generate header
        run: cbindgen --config cbindgen.toml --crate pe-ffi --output /tmp/pe_ffi.h
      - name: Show header
        run: cat /tmp/pe_ffi.h
